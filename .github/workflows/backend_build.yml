name: Build & Test Mojo Backend

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 레포지토리에 있는 코드 action환경으로 가져오기
        uses: actions/checkout@v3

      - name: JDK 17 설치
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: application-secret.properties 생성
        run: |
            echo "spring.datasource.url=jdbc:mysql://${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}" >> ./src/main/resources/application-secret.properties
            echo "spring.datasource.username=${{ secrets.DB_USER }}" >> ./src/main/resources/application-secret.properties
            echo "spring.datasource.password=${{ secrets.DB_PASSWORD }}" >> ./src/main/resources/application-secret.properties

      - name: Gradle 빌드 및 테스트
        run: ./gradlew build -Dspring.profiles.active=ci

