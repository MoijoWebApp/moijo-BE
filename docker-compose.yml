version: '3.8'

services:
  moijo-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moijo-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://moijo-mysql:3306/moijo_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Yjj6230936!
    depends_on:
      - moijo-mysql

  moijo-mysql:
    image: mysql:8.0
    container_name: moijo-mysql
    environment:
      MYSQL_DATABASE: moijo_db
      MYSQL_ROOT_PASSWORD: Yjj6230936!
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: